# 把 wiki/ 發佈成 GitHub Pages 網站：
#   wiki/  →  網站根目錄    https://<帳號>.github.io/<repo>/
# 使用前：Settings → Pages → Build and deployment → Source 選「GitHub Actions」
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 組合網站
        run: |
          set -euo pipefail
          test -f wiki/index.html || { echo "::error::找不到 wiki/index.html"; exit 1; }
          mkdir -p _site
          cp -a wiki/. _site/
          touch _site/.nojekyll

      - name: 檢查資料並產生 versions.json
        run: python3 tools/check_data.py _site/data

      - name: 網站內容
        run: find _site -maxdepth 3 | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
