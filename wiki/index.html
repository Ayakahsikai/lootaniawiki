<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="LOOTANIA 遊戲資料站：技能、符文、通貨、裝備與賽季資訊。">
<title>LOOTANIA Wiki</title>
<style>
/* LOOTANIA Wiki — 參考 poedb 的資料站風格：黑底、細框面板、表格列表、遊戲提示框 */
:root{
  --bg:#050505; --panel:#121212; --panel-head:#1b1b1b; --row:#0d0d0d; --row-alt:#111;
  --line:#2a2a2a; --line-2:#3a3a3a;
  --text:#c8c8c8; --muted:#7d7d7d; --link:#dcdcdc; --white:#f2f2f2;
  --accent:#c9a35b;            /* 品牌金 */
  --unique:#c3732f;            /* 裝備名稱（類似傳奇橘） */
  --mod:#8f8fff;               /* 秘藏能力（類似詞綴藍） */
  --mod-text:#b4b4ff;
  --warn:#e2725b;
  --f-ui:"Noto Sans TC",system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--f-ui)}
a{color:var(--link);text-decoration:none}
a:hover{color:#fff;text-decoration:underline}
button,select,input{font:13px var(--f-ui);color:var(--text);background:#0e0e0e;border:1px solid var(--line-2);border-radius:3px;padding:5px 9px}
button{cursor:pointer}button:hover{border-color:#555;color:#fff}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
[hidden]{display:none!important}

/* ---- 導覽列 ---- */
.nav{position:sticky;top:0;z-index:20;background:#0f0f0f;border-bottom:1px solid var(--line)}
.nav-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:4px;padding:0 14px;height:46px}
.brand{font-weight:700;color:var(--accent);letter-spacing:.04em;margin-right:14px;white-space:nowrap}
.brand:hover{text-decoration:none;color:#e0bd72}
.brand small{color:var(--muted);font-weight:400;margin-left:4px}
.menu{display:flex;align-items:stretch;height:100%}
.menu>li{list-style:none;position:relative}
.menu>li>a,.menu>li>span{display:flex;align-items:center;height:100%;padding:0 12px;color:var(--text)}
.menu>li>a:hover,.menu>li:hover>span,.menu>li:focus-within>span{background:#1a1a1a;color:#fff;text-decoration:none}
.menu>li.cur>a,.menu>li.cur>span{color:#fff;box-shadow:inset 0 -2px 0 var(--accent)}
.menu .caret{font-size:9px;margin-left:5px;opacity:.6}
.drop{display:none;position:absolute;left:0;top:100%;min-width:200px;background:#141414;border:1px solid var(--line-2);border-top:0;padding:6px 0;margin:0;columns:2;column-gap:0;width:300px}
.menu>li:hover .drop,.menu>li:focus-within .drop{display:block}
.drop li{list-style:none;break-inside:avoid}
.drop a{display:block;padding:4px 14px;font-size:13px}
.drop a:hover{background:#1f1f1f;text-decoration:none}
.drop a small{color:var(--muted);margin-left:4px}
.drop .off{display:block;padding:4px 14px;font-size:13px;color:#555}
.nav-search{margin-left:auto;display:flex}
.nav-search input{width:220px;border-radius:3px 0 0 3px}
.nav-search button{border-left:0;border-radius:0 3px 3px 0}
@media (max-width:720px){.nav-in{height:auto;flex-wrap:wrap;padding:6px 10px}.menu{height:36px}.nav-search{margin-left:0;width:100%;padding-bottom:6px}.nav-search input{flex:1;width:auto}}

/* ---- 版面 ---- */
main{max-width:1280px;margin:0 auto;padding:14px 14px 60px}
.crumb{font-size:12px;color:var(--muted);margin:2px 0 10px}
.crumb a{color:var(--muted)}.crumb a:hover{color:#fff}
.crumb span{margin:0 6px;opacity:.6}
h1{font-size:20px;font-weight:600;color:var(--white);margin:0 0 4px}
.lead{color:var(--muted);font-size:13px;margin:0 0 14px}
.notice{border:1px solid var(--warn);color:#f1b5a7;background:rgba(226,114,91,.07);padding:10px 12px;border-radius:3px;white-space:pre-line}

/* 面板（poedb 的 card） */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;margin-bottom:14px}
.panel>h2{margin:0;padding:7px 12px;background:var(--panel-head);border-bottom:1px solid var(--line);font-size:14px;font-weight:600;color:var(--white);display:flex;align-items:center;gap:8px}
.panel>h2 .n{color:var(--muted);font:12px var(--f-mono);font-weight:400}
.panel>h2 a{color:var(--white)}
.panel .body{padding:10px 12px}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;align-items:start}
.cols .panel{margin:0}
.links{list-style:none;margin:0;padding:6px 0}
.links li a,.links li .off{display:flex;align-items:center;gap:8px;padding:4px 12px;font-size:13px}
.links li a:hover{background:#191919;text-decoration:none}
.links li .off{color:#555}
.links .ico{width:22px;height:22px;flex:none;border:1px solid var(--line-2);border-radius:2px;background:#0a0a0a;display:grid;place-items:center;font-size:11px;color:var(--muted);overflow:hidden}
.links .ico img{width:100%;height:100%;object-fit:contain}
.links .cnt{margin-left:auto;color:var(--muted);font:12px var(--f-mono)}

/* ---- 裝備列表 ---- */
.toc{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin:0 0 12px;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:3px}
.toc a{color:var(--link)}.toc a .n{color:var(--muted);font:12px var(--f-mono);margin-left:2px}
.toc a.on{color:var(--accent)}
.toc.sub{margin-top:-6px;padding:6px 12px;font-size:12.5px;background:transparent;border-style:dashed}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters input[type=search]{flex:1 1 280px;min-width:0}
.filters label{display:flex;gap:5px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
.filters .count{margin-left:auto;color:var(--muted);font-size:12px}
table.items{width:100%;border-collapse:collapse}
table.items td{border-top:1px solid var(--line);padding:8px 10px;vertical-align:top}
table.items tr:nth-child(even) td{background:var(--row-alt)}
table.items tr:target td,table.items tr.flash td{background:#1c1810}
td.ic{width:76px}
.icon{width:60px;height:60px;border:1px solid var(--line-2);border-radius:2px;background:#0a0a0a;display:flex;align-items:center;justify-content:center;overflow:hidden}
.icon img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:pixelated}
.icon span{font-size:11px;color:var(--muted);text-align:center;padding:2px}
.it-name{color:var(--unique);font-weight:600;font-size:14.5px}
.it-name:hover{color:#e08a40}
.it-name.cur-name{color:#e6d39a}.it-name.cur-name:hover{color:#fff1c4}
.itip .h.cur-h{color:#e6d39a;background:linear-gradient(#22201a,#14130f)}
.it-id{color:#555;font:11px var(--f-mono);margin-left:8px}
.it-id:hover{color:var(--muted)}
.ln{font-size:13px}
.ln .k{color:var(--muted)}
.ln b{color:var(--white);font-weight:400}
.ln .unk{color:var(--warn)}
.mods{margin-top:3px}
.mods div{color:var(--mod);font-size:13px}
.mods .tx{color:var(--mod-text);font-style:italic}
.it-foot{margin-top:4px;font-size:12px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;padding:0 5px;border-radius:2px;border:1px solid var(--warn);color:var(--warn);margin-right:6px;line-height:16px}
mark{background:rgba(201,163,91,.33);color:inherit;border-radius:2px}
.empty{color:var(--muted);padding:24px 0;text-align:center}
@media (max-width:560px){td.ic{width:62px}.icon{width:48px;height:48px}}

/* ---- 遊戲提示框（滑過名稱時顯示） ---- */
.itip{position:fixed;z-index:50;pointer-events:none;width:300px;background:rgba(8,8,8,.97);border:1px solid #6e4a26;box-shadow:0 4px 18px rgba(0,0,0,.7);font-size:13px;text-align:center}
.itip .h{padding:6px 10px;background:linear-gradient(#2a1a0c,#1a1008);border-bottom:1px solid #6e4a26;color:var(--unique);font-weight:700;font-size:15px}
.itip .h small{display:block;color:#a8865c;font-weight:400;font-size:12px}
.itip .s{padding:6px 10px}
.itip .s+.s{border-top:1px solid #3d2a17}
.itip .k{color:var(--muted)}.itip b{color:var(--white);font-weight:400}
.itip .unk{color:var(--warn)}
.itip .m{color:var(--mod)}.itip .tx{color:var(--mod-text);font-style:italic}
.itip .v{color:var(--warn);font-size:12px}

/* ---- 技能 ---- */
:root{--sk-tag:#e8a33a;--sk-name:#7fc4ff}
.sk-name{color:var(--sk-name);font-weight:600;font-size:14.5px}
.sk-name:hover{color:#a9d8ff}
.sk-tags{font-size:12.5px;margin:1px 0 2px}
.sk-tag,.itip .sk-tag{color:var(--sk-tag);font-weight:400}
.sk-compat{color:var(--warn)}
.sk-desc{font-size:13px;color:var(--text);margin-top:3px}
.sk-eff{font-size:13px;color:var(--mod);margin-top:3px}
.sk-eff .k{color:var(--muted);font:12px var(--f-mono);margin-right:4px}
.sk-lvl{display:flex;flex-wrap:wrap;gap:0 10px;align-items:baseline}
.sk-lvl .k{min-width:40px}
.sk-req{color:var(--white);font-size:12.5px}
.sk-ef{color:var(--mod)}
.sk-more{margin-top:5px;font-size:12.5px}
.sk-more summary{cursor:pointer;color:var(--muted);width:max-content}
.sk-more summary:hover{color:#fff}
.sk-lvt{border-collapse:collapse;margin-top:6px;font-size:12.5px;min-width:min(520px,100%)}
.sk-lvt th,.sk-lvt td{border:1px solid var(--line);padding:3px 8px;text-align:center;white-space:nowrap}
.sk-lvt th{background:var(--panel-head);color:var(--muted);font-weight:400}
.sk-lvt td.l{text-align:left;white-space:normal;color:var(--mod)}
.sk-wrap{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{padding:2px 8px;font-size:12px;border-radius:999px}
.chips button.on{border-color:var(--sk-tag);color:var(--sk-tag);background:rgba(232,163,58,.08)}
/* 技能提示框：模仿遊戲的藍紫半透明視窗 */
.sk-tip{width:340px;background:rgba(40,42,92,.96);border:1px solid #8a8fd8;border-radius:4px;box-shadow:0 6px 22px rgba(0,0,0,.6);color:#f2f2f2;font-size:13px;line-height:1.5;padding:8px 10px 10px;text-align:left}
.sk-th{text-align:center;font-weight:700;font-size:16px;padding:2px 0 4px}
.sk-tip .sk-tags{text-align:center;margin:0 0 6px}
.sk-top{display:flex;gap:10px;align-items:flex-start}
.sk-ic{width:72px;height:72px;flex:none;background:#e9e9f4;border:2px solid #fff;border-radius:3px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.sk-ic img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:pixelated}
.sk-ic span{color:#555;font-size:11px}
.sk-info{flex:1;min-width:0}
.sk-tip .sk-desc{color:#f2f2f2;margin-top:2px}
.sk-mut{color:#aab}
.sk-lv{margin-top:6px}
.sk-lvh{color:#d8dcff}
.sk-ver{margin-top:6px;color:#ffb3a3;font-size:12px}
.sk-spr{display:block;width:100%;height:100%;background-repeat:no-repeat;image-rendering:pixelated}
.itip.sk{width:auto;background:none;border:0;box-shadow:none}
.sk-src{margin-top:7px;padding-top:6px;border-top:1px solid rgba(160,165,230,.35);color:#c9f0c0}
.sk-src span{display:block;color:#aab0e8;font-size:12px}
.ln b.sk-srcv{color:#9fdc92}

/* 下拉選單：單欄，樣式同遊戲資料站 */
.drop{columns:1;width:auto;min-width:150px;padding:4px 0}
.drop a,.drop .off{padding:7px 16px;font-size:14px;white-space:nowrap}
.drop a.on{color:var(--accent)}
.drop .off small{color:#444;margin-left:6px;font-size:12px}
.menu>li>span{cursor:pointer;user-select:none}
.menu>li.open .drop{display:block}
.info .body{padding:14px 16px}
.info h2{display:flex;align-items:center;gap:10px}
.info .ss{font:12px var(--f-ui);font-weight:400;padding:1px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted)}
.info .ss.on{color:#8fd18f;border-color:#2f5a2f}.info .ss.end{color:var(--warn);border-color:#6a3328}.info .ss.soon{color:var(--accent);border-color:#5a4826}
.info-edit{margin-left:auto;font-size:12px;padding:3px 10px}
.info-range{color:var(--muted);font-size:13px;margin-bottom:10px}
.info-md{line-height:1.85;color:var(--text)}
.info-md h3{font-size:15px;color:var(--white);margin:14px 0 6px;padding-left:8px;border-left:3px solid var(--accent)}
.info-md h3:first-child{margin-top:0}
.info-md p{margin:0 0 10px}.info-md ul{margin:0 0 10px;padding-left:20px}.info-md li{margin:2px 0}
.info-md b{color:var(--white)}.info-md a{color:var(--accent)}
.info-note{color:var(--accent);font-size:13px;margin:0 0 10px}
.info-upd{margin-top:10px;color:var(--muted);font-size:12px;text-align:right}
.info-form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);margin-bottom:10px}
.info-form input,.info-form textarea{width:100%;color:var(--text)}
.info-form textarea{font:13px/1.7 var(--f-ui);resize:vertical;background:#0e0e0e;border:1px solid var(--line-2);border-radius:3px;padding:8px 10px}
.info-dates{display:flex;gap:12px}.dt-in{display:flex;gap:6px}.dt-in input[type=date]{flex:1;min-width:0}.dt-in input[type=time]{width:120px;flex:none}.info-dates label{flex:1}
.info-tip{font-size:12px;color:var(--muted);margin:-4px 0 10px}.info-tip code{font:11px var(--f-mono);background:#1a1a1a;padding:1px 5px;border-radius:3px;color:var(--text)}
.ed-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:8px}
.ed-bar .lbl{font-size:13px;color:var(--muted)}
.ed-bar .quick{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.ed-bar .quick button{font-size:12px;padding:2px 8px;border-radius:999px}
.ed-bar .tools{margin-left:auto;display:flex;gap:4px}.ed-bar .tools button{font-size:12px;padding:2px 9px}
.secs{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.sec{border:1px solid var(--line-2);border-radius:4px;padding:10px;background:#0b0b0b}
.sec-h{display:flex;gap:4px;margin-bottom:6px}
.sec-t{flex:1;min-width:0;font-weight:600;color:var(--white)}
.ib{padding:2px 8px;font-size:12px;color:var(--muted)}.ib:disabled{opacity:.3;cursor:default}
.ib.del:hover,.ib.armed{color:var(--warn);border-color:var(--warn)}
.sec-n{width:100%;font:13px/1.7 var(--f-ui);resize:vertical;background:#0e0e0e;border:1px solid var(--line);border-radius:3px;padding:5px 9px;color:var(--text);margin-bottom:6px}
.sec-items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.sec-items li{display:flex;align-items:center;gap:6px}
.sec-items .dot{color:var(--accent);width:10px;text-align:center}
.sec-items input{flex:1;min-width:0}
.add-item{margin-top:6px;font-size:12px;padding:2px 10px;border-style:dashed;color:var(--muted)}
.info-tip kbd{font:11px var(--f-mono);padding:0 4px;border:1px solid var(--line-2);border-radius:3px;color:var(--text)}
.info-pv-h{font-size:12px;color:var(--muted);margin-bottom:4px}
.info-pv{border:1px dashed var(--line-2);border-radius:3px;padding:10px 12px;min-height:60px;margin-bottom:12px}
.info-form .row{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.info-msg{margin-right:auto;color:var(--warn);font-size:13px}
button.primary{background:var(--accent);border-color:var(--accent);color:#1a1408;font-weight:600}button.primary:hover{color:#000}
@media (max-width:560px){.info-dates{flex-direction:column;gap:0}}
.dt{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.dt-main{min-width:0}
.dt-head{display:flex;align-items:center;gap:14px;margin:4px 0 14px;flex-wrap:wrap}
.dt-ic{width:72px;height:72px}.dt-ic .sk-spr{width:72px;height:72px}
.dt-tt{flex:1;min-width:0}.dt-tt h1{margin:0 0 4px;font-size:24px;color:var(--white)}
.dt-nav{display:flex;gap:6px;font-size:13px}.dt-nav a{border:1px solid var(--line-2);border-radius:3px;padding:3px 10px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.dt-nav a:hover{text-decoration:none;border-color:#555}
.dt-info{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0}
.dt-info dt{color:var(--muted)}.dt-info dd{margin:0;color:var(--white)}.dt-info small{color:var(--muted);margin-left:2px}
.dt-src{color:#8fd18f}.dt-chip{display:inline-block;font-size:12px;border:1px solid var(--line-2);border-radius:999px;padding:0 8px;margin:0 4px 2px 0;color:var(--text)}
.dt-desc{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);line-height:1.8}
.dt-eff div{display:flex;gap:10px;color:var(--mod-text);line-height:1.8}.dt-eff .k{color:var(--muted);min-width:44px;font:12px/1.8 var(--f-mono)}
.dt-hint{font-weight:400;color:var(--muted);font-size:12px;margin-left:10px}
.dt-lvt{width:100%;margin:0}.dt-lvt tbody tr{cursor:pointer}.dt-lvt tbody tr:hover td{background:#1a1a1a}
.dt-lvt tr.on td{background:#2a2410!important;color:var(--white)}
.dt-lvt tr.over td{color:var(--muted)}.dt-lvt tr.over td.l{color:#9a9ad8}
.dt-lvt tr.sep td{background:var(--panel-head);color:var(--accent);font-size:12px;cursor:default;text-align:left}
.dt-side{position:relative}.dt-sticky{position:sticky;top:60px;display:flex;flex-direction:column;gap:8px}
.dt-lvsel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}.dt-lvsel input{flex:1;padding:0}.dt-lvsel b{color:var(--white);min-width:48px;text-align:right;font-family:var(--f-mono)}
#dtTip .sk-tip{width:100%}
td.ic .icon{cursor:pointer}
@media (max-width:900px){.dt{grid-template-columns:1fr}.dt-side{order:-1}.dt-sticky{position:static}}
.dt-runes .body{padding:10px 12px}
.rn-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.rn-list .rn-it{display:flex;align-items:center;gap:10px;padding:4px 6px;border-radius:3px;color:var(--text);cursor:default}   /* 只顯示提示框，不連到符文頁 */
.rn-list .rn-it:hover{background:#1a1a1a;color:#fff}
.rn-list .icon{width:36px;height:36px;flex:none}.rn-list .icon .sk-spr{width:36px;height:36px}
.rn-t{display:flex;flex-direction:column;min-width:0;line-height:1.35}.rn-t b{font-weight:500;color:var(--white)}.rn-t small{color:#e2725b;font-size:11.5px}
a.wl{color:var(--accent);border-bottom:1px dotted currentColor}a.wl:hover{text-decoration:none;color:#e0bd72}
a.wl.q{color:#8fd18f}a.wl.q:hover{color:#b5e6b5}
a.wl.miss{color:var(--warn);border-bottom-style:dashed}
.wl-pick{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px;padding:8px;border:1px solid var(--accent);border-radius:4px;background:#0b0b0b}
.wl-pick input{flex:1;min-width:180px}.wl-msg{width:100%;font-size:12px;color:var(--warn)}.wl-msg:empty{display:none}
.ver-sel{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.ver-sel select{font-size:12.5px;padding:3px 6px;max-width:220px}
.ver-old{margin:0 0 10px;padding:8px 12px;border:1px solid #5a4826;background:#1d1708;color:#e9d3a3;border-radius:4px;font-size:13px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}

<script>
/* 技能顯示共用：技能列表與技能編輯器的預覽都用這支，確保兩邊顯示一致 */
window.SkillCard = (() => {
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const num = v => (typeof v === 'number' && isFinite(v)) ? String(+v.toFixed(2)) : (v == null || v === '' ? '?' : String(v));
  const kindLabel = (s, meta) => ((meta.skillKinds || []).find(k => k.id === s.kind) || {}).label || s.kind || '';
  const isRune = s => s.kind === 'rune';
  // 符文沒有等級：效果模板＋一組數值（values）
  const runeEffect = s => s.effect ? String(s.effect).replace(/\{(\d+)\}/g, (_, i) => num((s.values || [])[+i])) : (s.desc || '');   // 舊資料只有說明時，用說明當效果
  // 效果模板：{0}、{1}… 依序換成該等級的數值；數值缺少時顯示 ?
  function effectAt(s, row) {
    const t = s.effect || ''; if (!t) return '';
    const v = (row && row.v) || [];
    return t.replace(/\{(\d+)\}/g, (_, i) => num(v[+i]));
  }
  const slots = t => { let n = 0; String(t || '').replace(/\{(\d+)\}/g, (_, i) => { n = Math.max(n, +i + 1); }); return n; };
  // 「Lv.10 | 力量 35」
  function reqText(row, meta) {
    const r = (row && row.req) || {}, out = [];
    if (r.level != null) out.push(`Lv.${num(r.level)}`);
    for (const k of meta.requirements || []) { if (k === 'level' || r[k] == null || r[k] === 0) continue; out.push(`${meta.requirementLabels[k] || k} ${num(r[k])}`); }
    return out.join(' | ') || '無';
  }
  const tagsHTML = list => (list || []).map(t => `<b class="sk-tag">【${esc(t)}】</b>`).join('');
  const weaponsText = s => (s.weapons || []).join('/');
  const descHTML = s => esc(s.desc || '').replace(/\n/g, '<br>');
  const levelsOf = s => (s.levels || []).slice().sort((a, b) => (a.lv || 0) - (b.lv || 0));
  // 圖示表（一張大圖切成格子，技能的 icon 填格子編號，0 起算、由左到右、由上到下）
  let SHEET = null;   // { src, cell, cols, rows }
  function setSheet(sh) { SHEET = sh && sh.src && sh.cols > 0 ? { ...sh, rows: Math.max(1, sh.rows || Math.ceil((sh.count || sh.cols) / sh.cols)) } : null; }
  function sprite(i) {
    if (!SHEET || !(i >= 0)) return '';
    const { cols, rows } = SHEET, c = i % cols, r = Math.floor(i / cols);
    return `<i class="sk-spr" style="background-image:url('${esc(SHEET.src)}');background-size:${cols * 100}% ${rows * 100}%;background-position:${cols > 1 ? c / (cols - 1) * 100 : 0}% ${rows > 1 ? r / (rows - 1) * 100 : 0}%"></i>`;
  }
  // 圖示：數字＝圖示表的格子；文字＝單張圖片路徑（舊格式）；沒有就顯示種類文字
  function iconHTML(s, meta) {
    if (typeof s.icon === 'number' && SHEET) return sprite(s.icon);
    if (typeof s.icon === 'string' && s.icon) return `<img src="${esc(s.icon)}" alt="" loading="lazy">`;
    return `<span>${esc(kindLabel(s, meta))}</span>`;
  }
  // 遊戲內提示框（模仿遊戲：標籤、等級上限、需求武器、說明、現在/下一等級）
  function tip(s, meta, opt = {}) {
    const L = levelsOf(s), cur = L[opt.idx || 0], nxt = L[(opt.idx || 0) + 1];
    const ic = iconHTML(s, meta);
    const head = isRune(s) ? `符文：${esc(s.name || '（未命名）')}` : esc(s.name || '（未命名）');
    const info = [];
    if (!isRune(s) && s.maxLevel) info.push(`[等級上限:${num(s.maxLevel)}]`);
    if ((s.weapons || []).length) info.push(`需求武器: ${esc(weaponsText(s))}`);
    const lvBlock = (r, label) => r ? `<div class="sk-lv"><div class="sk-lvh">[${label}:${num(r.lv)}] 需求：${esc(reqText(r, meta))}</div>${s.effect ? `<div>${esc(effectAt(s, r))}</div>` : ''}</div>` : '';
    return `<div class="sk-tip">
      <div class="sk-th">${head}</div>
      ${(s.tags || []).length ? `<div class="sk-tags">${tagsHTML(s.tags)}</div>` : ''}
      <div class="sk-top"><div class="sk-ic">${ic}</div><div class="sk-info">${info.map(x => `<div>${x}</div>`).join('')}<div class="sk-desc">${isRune(s) ? (esc(runeEffect(s)) || '<span class="sk-mut">（尚無效果）</span>') : (descHTML(s) || '<span class="sk-mut">（尚無說明）</span>')}</div>
      ${(s.compatTags || []).length ? `<div>相容標籤：<span class="sk-compat">${(s.compatTags).map(t => `【${esc(t)}】`).join('')}</span></div>` : ''}</div></div>
      ${isRune(s) ? '' : lvBlock(cur, '現在等級') + lvBlock(nxt, '下一等級')}
      ${s.source ? `<div class="sk-src"><span>獲得方式</span>${esc(s.source).replace(/\n/g, '<br>')}</div>` : ''}
      ${(s.verify || []).length ? `<div class="sk-ver">待確認：${esc(s.verify.join('、'))}</div>` : ''}
    </div>`;
  }
  // 全部等級表
  function levelTable(s, meta) {
    const L = levelsOf(s); if (!L.length) return '';
    const keys = (meta.requirements || []).filter(k => k !== 'level' && L.some(r => r.req && r.req[k]));
    const n = slots(s.effect);
    return `<table class="sk-lvt"><thead><tr><th>等級</th><th>需求等級</th>${keys.map(k => `<th>${esc(meta.requirementLabels[k] || k)}</th>`).join('')}<th>效果</th></tr></thead><tbody>${
      L.map(r => `<tr><td>${num(r.lv)}</td><td>${r.req && r.req.level != null ? num(r.req.level) : '—'}</td>${keys.map(k => `<td>${r.req && r.req[k] ? num(r.req[k]) : '—'}</td>`).join('')}<td class="l">${n ? esc(effectAt(s, r)) : '—'}</td></tr>`).join('')}</tbody></table>`;
  }
  function hl(s, terms) { let h = esc(s); for (const t of terms || []) { if (t) h = h.split(esc(t)).join(`<mark>${esc(t)}</mark>`); } return h; }
  // 列表的一列（poedb 式）
  function row(s, meta, terms) {
    // 摘要只列 Lv.1 與等級上限那一級（超過上限的加成等級在「全部等級」裡看）
    const L = levelsOf(s), first = L[0], inCap = L.filter(r => !s.maxLevel || r.lv <= s.maxLevel), last = inCap[inCap.length - 1] || first;
    const ic = iconHTML(s, meta);
    const lines = [];
    if (!isRune(s) && s.maxLevel) lines.push(`<span class="k">等級上限:</span> <b>${num(s.maxLevel)}</b>`);
    if ((s.weapons || []).length) lines.push(`<span class="k">需求武器:</span> <b>${hl(weaponsText(s), terms)}</b>`);
    if ((s.compatTags || []).length) lines.push(`<span class="k">相容標籤:</span> <span class="sk-compat">${s.compatTags.map(t => `【${hl(t, terms)}】`).join('')}</span>`);
    if (s.source) lines.push(`<span class="k">獲得方式:</span> <b class="sk-srcv">${hl(s.source, terms).replace(/\n/g, '<br>')}</b>`);
    const lvLine = r => `<div class="sk-lvl"><span class="k">Lv.${num(r.lv)}</span><span class="sk-req">${esc(reqText(r, meta))}</span>${s.effect ? `<span class="sk-ef">${hl(effectAt(s, r), terms)}</span>` : ''}</div>`;
    const eff = isRune(s) ? (runeEffect(s) ? `<div class="sk-eff">${hl(runeEffect(s), terms)}</div>` : '')
      : first ? `<div class="sk-eff">${lvLine(first)}${last !== first ? lvLine(last) : ''}</div>` : '';
    const ver = (s.verify || []).length ? `<div><span class="badge">待確認</span>${esc(s.verify.join('、'))}</div>` : '';
    const foot = [ver, s.note ? `<div>${esc(s.note)}</div>` : ''].join('');
    return `<tr id="${esc(s.id)}"><td class="ic"><div class="icon">${ic}</div></td><td>
      <a class="sk-name" href="#${esc(s.id)}" data-tip="${esc(s.id)}">${hl(s.name, terms)}</a><a class="it-id" href="#${esc(s.id)}" title="此技能的連結">${esc(s.id)}</a>
      ${(s.tags || []).length ? `<div class="sk-tags">${(s.tags).map(t => `<b class="sk-tag">【${hl(t, terms)}】</b>`).join('')}</div>` : ''}
      ${lines.map(x => `<div class="ln">${x}</div>`).join('')}
      ${s.desc && !isRune(s) ? `<div class="sk-desc">${hl(s.desc, terms).replace(/\n/g, '<br>')}</div>` : ''}${eff}
      ${L.length > 1 ? `<details class="sk-more"><summary>全部等級（${L.length}）</summary>${levelTable(s, meta)}</details>` : ''}
      ${foot ? `<div class="it-foot">${foot}</div>` : ''}</td></tr>`;
  }
  // 天賦模擬器用：技能 → 天賦條件 id（標籤經 meta.skillTags.cond 轉換，武器群組展開成武器分類）
  function talentConds(s, meta) {
    const tagCond = new Map((meta.skillTags || []).map(t => [t.id, t.cond]));
    const skill = [...new Set((s.tags || []).map(t => tagCond.get(t)).filter(Boolean))];
    const wg = meta.weaponGroups || {}, wt = new Set((meta.weaponTypes || []).map(w => w.id));
    const weapons = [...new Set((s.weapons || []).flatMap(w => wg[w] || (wt.has(w) ? [w] : [])))];
    return { skill, weapons };
  }
  return { esc, num, runeEffect, effectAt, slots, reqText, tip, row, levelTable, talentConds, kindLabel, levelsOf, setSheet, sprite, iconHTML };
})();

</script>
<script>
// 預設定義：skills.json 沒有 meta 時使用（技能編輯器存檔時會把 meta 一起寫進 skills.json）
const DEFAULT_META = {
  requirements: ['level', 'str', 'dex', 'int', 'luk'],
  requirementLabels: { level: '角色等級', str: '力量', dex: '敏捷', int: '智力', luk: '幸運' },
  weaponTypes: ['單手劍', '雙手劍', '單手斧', '雙手斧', '單手棍', '雙手棍', '短劍', '拳套', '槍矛', '弓弩', '短杖', '長杖'].map(id => ({ id })),
  skillKinds: [{ id: 'skill', label: '主動技能', prefix: 'sk' }, { id: 'passive', label: '被動技能', prefix: 'sk' }, { id: 'rune', label: '符文', prefix: 'rn' }],
  skillTags: [['攻擊','攻擊'],['法術','法術'],['近戰','近戰'],['投射物','投射物'],['投擲','投擲'],['召喚物','召喚物'],['血魔法','血魔法'],['連擊','連擊'],['範圍','範圍'],['引導','引導'],['單體','單體'],['指定','指定技能'],['位移','位移'],['增益','增益'],['詛咒','詛咒'],['附魔','附魔'],['荊棘','荊棘'],['物理',null],['火焰','火焰技能'],['冰冷','冰冷技能'],['閃電','閃電技能'],['毒素','毒素技能'],['神聖','神聖技能']].map(([id, cond]) => cond ? { id, cond } : { id }),
  weaponGroups: { '劍': ['單手劍', '雙手劍'], '斧': ['單手斧', '雙手斧'], '棍': ['單手棍', '雙手棍'], '杖': ['短杖', '長杖'], '槍矛': ['槍矛'], '短劍': ['短劍'], '拳套': ['拳套'], '弓弩': ['弓弩'],
    '所有近戰武器': ['單手劍', '雙手劍', '單手斧', '雙手斧', '單手棍', '雙手棍', '短劍', '槍矛'] }
};
// skills.json 的 meta 只需要存有改過的部分；缺的欄位用預設補上
// 武器群組：之後新增的預設群組（例如「所有近戰武器」）會自動補進資料檔；
// wgDefaults 記錄已經補過哪些，使用者刪掉或改名後就不會再補回來
const mergeMeta = m => {
  const d = JSON.parse(JSON.stringify(DEFAULT_META)), o = { ...d, ...(m || {}) };
  if (m && m.weaponGroups) { const seen = new Set(m.wgDefaults || []); o.weaponGroups = { ...m.weaponGroups };
    for (const [k, v] of Object.entries(d.weaponGroups)) if (!seen.has(k) && !(k in o.weaponGroups)) o.weaponGroups[k] = v; }
  o.wgDefaults = Object.keys(d.weaponGroups);
  return o;
};
// 搜尋語法：空格＝且；|＝或（魔力|魔靈）；-詞＝排除（-符文、-火|冰）
function parseQuery(raw) {
  const groups = [], exc = [], alts = t => t.split(/[|｜]/).filter(Boolean);
  for (const t of String(raw || '').trim().split(/\s+/).filter(Boolean)) {
    if (/^[-－]./.test(t)) exc.push(...alts(t.slice(1))); else if (alts(t).length) groups.push(alts(t));
  }
  return { terms: groups.flat(), test: x => groups.every(g => g.some(a => x.includes(a))) && !exc.some(e => x.includes(e)) };
}

</script>

<script>
(() => {
  const $ = id => document.getElementById(id), SC = SkillCard, esc = SC.esc;

  /* ---------- 資料來源 ---------- */
  // 資料夾：本機版＝和頁面同一層；GitHub Pages 版＝data/（建置時設定 WIKI_DATA_DIR）
  const DATA_DIR = window.WIKI_DATA_DIR || '';
  // 可以編輯首頁資訊欄：本機開啟或預覽版；放到網站上（https）時只顯示、不提供編輯
  const CAN_EDIT = !!window.WIKI_PREVIEW || location.protocol === 'file:';
  // 資料依版本分資料夾：data/versions.js 列出版本，data/<版本資料夾>/skills.js、runes.js、圖示表
  let VDIR = DATA_DIR;   // 目前版本的資料夾（含結尾 /）
  /* ---------- 裝備顯示：屬性、需求、列表列、提示框（圖示用 iconIndex 對應 equipment-icons.png 的格子） ---------- */
  const EQ_META = { slots: ['武器', '副手', '帽子', '衣服', '褲子', '鞋子', '手套', '披風', '耳環', '項鍊', '戒指', '腰帶', '其他'],
    weaponTypes: ['單手劍', '雙手劍', '單手斧', '雙手斧', '單手棍', '雙手棍', '短劍', '拳套', '槍矛', '弓弩', '短杖', '長杖'].map(id => ({ id })), attackSpeeds: { 3: '更快', 4: '快', 5: '快', 6: '普通', 7: '慢', 8: '慢' },
    requirements: ['level', 'str', 'dex', 'int', 'luk'], requirementLabels: { level: '裝備等級', str: '力量', dex: '敏捷', int: '智力', luk: '幸運' } };
  const EQ = (() => {
    const n = v => (typeof v === 'number' && isFinite(v)) ? String(+v.toFixed(2)) : '?';
    const u = m => m.unit === 'percent' ? '%' : '';
    // 與遊戲顯示一致：固定值「+38%」、範圍「+(30~45)%」；負數不加 +
    const val = m => 'value' in m ? `${m.value >= 0 ? '+' : ''}${n(m.value)}${u(m)}` : `${m.min >= 0 ? '+' : ''}(${n(m.min)}~${n(m.max)})${u(m)}`;
    const modText = m => !m ? '' : 'text' in m ? (m.text || '') : `${m.stat || '（未填屬性）'}：${val(m)}`;
    const typeOf = it => it.slot === '武器' ? (it.weaponType || '武器') : it.slot;
    const hl = (t, terms) => { let h = esc(t); for (const x of terms || []) if (x) h = h.split(esc(x)).join(`<mark>${esc(x)}</mark>`); return h; };
    function reqLine(it, meta) { const r = it.req || {}, parts = [];
      for (const k of meta.requirements) { const v = r[k]; if (!v) continue; parts.push(k === 'level' ? `等級 <b>${esc(v)}</b>` : `<b>${esc(v)}</b> ${esc(meta.requirementLabels[k] || k)}`); }
      return parts.length ? `<span class="k">需要</span> ${parts.join(', ')}` : '<span class="k">無需求</span>'; }
    function props(it, meta, terms) {
      const out = [`<div class="ln"><span class="k">${it.slot === '武器' ? '武器分類' : '部位'}:</span> <b>${esc(typeOf(it) || '—')}</b>${it.note ? ` <span class="k">(${esc(it.note)})</span>` : ''}</div>`];
      if (it.attackSpeed != null) out.push(`<div class="ln"><span class="k">攻擊速度:</span> <b>${esc((meta.attackSpeeds || {})[it.attackSpeed] || '?')}(${esc(it.attackSpeed)})</b></div>`);
      for (const m of it.base || []) out.push('text' in m ? `<div class="ln">${hl(m.text, terms)}</div>` : `<div class="ln"><span class="k">${hl(m.stat, terms)}:</span> <b>${esc(val(m))}</b></div>`);
      return out.join(''); }
    const mods = (it, terms) => (it.affix || it.hidden || []).map(m => `<div class="">${hl(modText(m), terms)}</div>`).join('');   // 純文字詞綴和數值詞綴同樣式
    const iconHTML = it => typeof it.iconIndex === 'number' && it.iconIndex >= 0 ? (SC.sprite(it.iconIndex) || `<span>${esc(typeOf(it))}</span>`) : `<span>${esc(typeOf(it) || '?')}</span>`;
    function row(it, meta, terms) { const md = mods(it, terms);
      return `<tr id="${esc(it.id)}"><td class="ic"><div class="icon">${iconHTML(it)}</div></td><td>
        <a class="it-name" href="#${esc(it.id)}" data-tip="${esc(it.id)}">${hl(it.name, terms)}</a><a class="it-id" href="#${esc(it.id)}" title="此裝備的連結">${esc(it.id)}</a>
        <div class="ln">${reqLine(it, meta)}</div>${props(it, meta, terms)}
        ${md ? `<div class="mods">${md}</div>` : ''}${it.source ? `<div class="it-foot">獲得方式：${hl(it.source, terms)}</div>` : ''}</td></tr>`; }
    function tip(it, meta) { const md = mods(it, []);
      return `<div class="h">${esc(it.name)}<small>${esc(typeOf(it) || '')}</small></div>
        <div class="s">${props(it, meta, []).replace(/class="ln"/g, '')}</div><div class="s">${reqLine(it, meta)}</div>
        ${md ? `<div class="s">${md.replace(/<div class="">/g, '<div class="m">')}</div>` : ''}${it.source ? `<div class="s"><span class="k">獲得方式：</span>${esc(it.source)}</div>` : ''}`; }
    const searchText = it => [it.name, it.id, it.slot, it.weaponType, it.note, it.source, ...(it.base || []).map(modText), ...(it.affix || it.hidden || []).map(modText)].join(' ');
    return { row, tip, iconHTML, searchText, typeOf, tipClass: 'itip' };
  })();
  /* ---------- 通貨顯示：種類、說明、獲得方式（圖示用 iconIndex 對應 currency-icons.png） ---------- */
  const CUR = (() => {

    const p = new URLSearchParams(); if (cat) p.set('cat', cat.id); if (raw) p.set('q', raw); if (w) p.set('weapon', w); if (selTags.size) p.set('tags', [...selTags].join(','));
    if (so !== page.defSort) p.set('sort', so);
    const h = `#/${page.id}${p.toString() ? '?' + p : ''}`; listHash[page.id] = h;
    if (location.hash !== h && !location.hash.startsWith(`#/${page.id}/`)) { try { history.replaceState(null, '', h); } catch (e) {} }
  }

  /* ---------- 路由：#/  #/active  #/runes?q=…  #/active/sk-0042 ---------- */
  /* ---------- 技能詳細頁：#/active/sk-0010 ---------- */
  const listHash = {};
  const DETAIL_SRC = new Set(['skills']);   // 符文沒有等級，維持在列表裡標示
  // 可搭配的符文：符文的相容標籤和技能標籤有任一相同就列出；沒填相容標籤的符文不列入
  // 相容標籤寫法（每一項符合任一即可）：「攻擊」＝有攻擊標籤；「近戰單體」「指定範圍」＝同時有這幾個標籤；
  // 「法術（非保留）」「法術（非引導、非保留）」＝有法術、但不能有括號裡的標籤；「全部」＝所有技能；舊寫法「非X」＝不能有 X
  function compatParse(c, known) { let t = String(c || '').trim(); const not = [];
    const m = /^(.*?)[（(]([^）)]*)[）)]$/.exec(t);
    if (m) { t = m[1].trim(); for (const x of m[2].split(/[、,，\s]+/)) { const y = x.trim().replace(/^非/, ''); if (y) not.push(y); } }
    if (/^非./.test(t) && !known.includes(t)) return { neg: t.slice(1) };
    if (!t || t === '全部') return { need: [], not };
    const K = known.filter(k => k && !/[（(]/.test(k) && k !== '全部').sort((a, b) => b.length - a.length), need = []; let rest = t;
    while (rest) { const k = K.find(k => rest.startsWith(k)); if (!k) return { need: [t], not }; need.push(k); rest = rest.slice(k.length); }
    return { need, not }; }
  function compatMatch(compat, tags, known) { const T = new Set(tags || []), ps = (compat || []).map(c => [c, compatParse(c, known)]);
    const negs = ps.filter(([, p]) => p.neg); if (negs.some(([, p]) => T.has(p.neg))) return [];
    const pos = ps.filter(([, p]) => !p.neg); if (!pos.length) return negs.map(([c]) => c);
    return pos.filter(([, p]) => p.need.every(x => T.has(x)) && !p.not.some(x => T.has(x))).map(([c]) => c); }
  const knownTags = () => [...new Set([...((SRC.skills.meta || {}).skillTags || []).map(t => t.id), ...SRC.skills.items.flatMap(x => x.tags || [])])];
  function runesFor(s) {
    const R = SRC.runes; if (!R.ok) return '';
    const match = r => compatMatch(r.compatTags || [], s.tags || [], knownTags());
    const hit = R.items.map(r => [r, match(r)]).filter(([, m]) => m.length);
    useSheet(R);
    const html = `<section class="panel dt-runes"><h2>可搭配的符文 <span class="n">/${hit.length}</span></h2><div class="body">
      ${hit.length ? `<ul class="rn-list">${hit.map(([r, m]) => `<li><span class="rn-it" data-tip="${esc(r.id)}"><span class="icon">${SC.iconHTML(r, R.meta)}</span><span class="rn-t"><b>${esc(r.name)}</b><small>${m.map(x => `【${esc(x)}】`).join('')}</small></span></span></li>`).join('')}</ul>`
        : '<p class="sk-mut">沒有相容標籤符合的符文。</p>'}
</div></section>`;
    useSheet(SRC.skills); return html;
  }
  function openDetail(p, id) {
    const s0 = SRC[p.src], s = p.items.find(x => x.id === id);
    page = p; src = s0; meta = s0.meta; useSheet(s0);
    const back = listHash[p.id] || `#/${p.id}`;
    $('crumb').hidden = false;
    $('crumb').innerHTML = `<a href="#/">首頁</a><span>›</span>${esc(p.menu)}<span>›</span><a href="${esc(back)}">${esc(p.label)}</a>${s ? `<span>›</span>${esc(s.name)}` : ''}`;
    $('home').hidden = true; $('app').hidden = true; $('none').hidden = true; $('detail').hidden = false;
    if (!s) { $('detail').innerHTML = `<p class="empty">${curV && curV.version ? `版本 ${esc(curV.version)} 沒有這個技能` : '找不到這個技能'}（${esc(id)}），可能是之後才新增，或已改名、刪除。<a href="${esc(back)}">回到${esc(p.label)}列表</a></p>`; return; }
    document.title = `${s.name} · ${p.label} · LOOTANIA Wiki`;
    const L = SC.levelsOf(s), cap = s.maxLevel || 0;
    const order = p.items.slice().sort(byPrice(1)), oi = order.indexOf(s);
    const prev = order[oi - 1], next = order[oi + 1];
    const wg = meta.weaponGroups || {};
    const weapons = (s.weapons || []).map(w => wg[w] && !(wg[w].length === 1 && wg[w][0] === w) ? `${esc(w)}<small>（${wg[w].map(esc).join('、')}）</small>` : esc(w)).join('、');
    const conds = SC.talentConds(s, meta);
    const info = [
      ['種類', esc(SC.kindLabel(s, meta))],
      cap ? ['等級上限', `${cap}${L.length > cap ? `<small>（資料到 Lv.${L[L.length - 1].lv}，超過上限的是加成等級）</small>` : ''}`] : null,
      ['需求武器', weapons || '無'],
      s.source ? ['獲得方式', `<span class="dt-src">${esc(s.source).replace(/\n/g, '<br>')}</span>`] : null,
      conds.skill.length ? ['對應天賦條件', conds.skill.map(c => `<span class="dt-chip">${esc(c)}</span>`).join('')] : null,
    ].filter(Boolean);
    const keys = (meta.requirements || []).filter(k => k !== 'level' && L.some(r => r.req && r.req[k]));
    const capRow = L.filter(r => !cap || r.lv <= cap).pop() || L[0];
    const rowHTML = (r, i) => `<tr data-i="${i}" class="${cap && r.lv > cap ? 'over' : ''}"><td>${SC.num(r.lv)}</td><td>${r.req && r.req.level != null ? SC.num(r.req.level) : '—'}</td>${keys.map(k => `<td>${r.req && r.req[k] ? SC.num(r.req[k]) : '—'}</td>`).join('')}<td class="l">${s.effect ? esc(SC.effectAt(s, r)) : '—'}</td></tr>`;
    let rows = '';
    L.forEach((r, i) => { if (cap && r.lv === cap + 1) rows += `<tr class="sep"><td colspan="${3 + keys.length}">超過等級上限（加成等級）</td></tr>`; rows += rowHTML(r, i); });
    $('detail').innerHTML = `<div class="dt-head"><div class="icon dt-ic">${SC.iconHTML(s, meta)}</div>
          <div class="dt-tt"><h1>${esc(s.name)}</h1>${(s.tags || []).length ? `<div class="sk-tags">${s.tags.map(x => `<b class="sk-tag">【${esc(x)}】</b>`).join('')}</div>` : ''}</div>
          <nav class="dt-nav" aria-label="上一個、下一個技能">${prev ? `<a href="#/${p.id}/${esc(prev.id)}" title="${esc(prev.name)}">‹ ${esc(prev.name)}</a>` : '<span></span>'}${next ? `<a href="#/${p.id}/${esc(next.id)}" title="${esc(next.name)}">${esc(next.name)} ›</a>` : ''}</nav></div>
    <div class="dt">
      <div class="dt-main">
                <section class="panel"><h2>基本資料</h2><div class="body">
          <dl class="dt-info">${info.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
          ${s.desc ? `<div class="dt-desc">${esc(s.desc).replace(/\n/g, '<br>')}</div>` : ''}</div></section>
        ${s.effect && L.length ? `<section class="panel"><h2>效果</h2><div class="body dt-eff">
          <div><span class="k">Lv.${SC.num(L[0].lv)}</span>${esc(SC.effectAt(s, L[0]))}</div>
          ${capRow !== L[0] ? `<div><span class="k">Lv.${SC.num(capRow.lv)}</span>${esc(SC.effectAt(s, capRow))}</div>` : ''}</div></section>` : ''}
        ${L.length ? `<section class="panel"><h2>等級資料 <span class="n">/${L.length}</span><small class="dt-hint">點一列可在右側預覽該等級</small></h2>
          <div class="sk-wrap"><table class="sk-lvt dt-lvt"><thead><tr><th>等級</th><th>需求等級</th>${keys.map(k => `<th>${esc(meta.requirementLabels[k] || k)}</th>`).join('')}<th>效果</th></tr></thead><tbody>${rows}</tbody></table></div></section>` : ''}
        ${s.note || (s.verify || []).length ? `<section class="panel"><h2>備註</h2><div class="body">${s.note ? `<div>${esc(s.note)}</div>` : ''}${(s.verify || []).length ? `<div><span class="badge">待確認</span>${esc(s.verify.join('、'))}</div>` : ''}</div></section>` : ''}
        <p><a href="${esc(back)}">‹ 回到${esc(p.label)}列表</a></p>
      </div>
      <aside class="dt-side"><div class="dt-sticky">
        ${L.length > 1 ? `<label class="dt-lvsel">預覽等級 <input type="range" id="dtLv" min="0" max="${L.length - 1}" value="0" aria-label="預覽等級"><b id="dtLvN">Lv.${SC.num(L[0].lv)}</b></label>` : ''}
        <div id="dtTip">${SC.tip(s, meta, { idx: 0 })}</div>
        ${runesFor(s)}</div></aside>
    </div>`;
    const pick = i => { useSheet(s0); $('dtTip').innerHTML = SC.tip(s, meta, { idx: i }); if ($('dtLv')) { $('dtLv').value = i; $('dtLvN').textContent = 'Lv.' + SC.num(L[i].lv); }
      $('detail').querySelectorAll('.dt-lvt tr.on').forEach(r => r.classList.remove('on')); const tr = $('detail').querySelector(`.dt-lvt tr[data-i="${i}"]`); if (tr) tr.classList.add('on'); };
    if ($('dtLv')) $('dtLv').addEventListener('input', e => pick(+e.target.value));
    $('detail').querySelector('.dt-lvt')?.addEventListener('click', e => { const tr = e.target.closest('tr[data-i]'); if (tr) pick(+tr.dataset.i); });
    pick(0);
  }

  function route() {
    tip.hidden = true; closeMenus(); $('detail').hidden = true;
    const h = location.hash.replace(/^#\/?/, ''), [path, qs] = h.split('?'), params = new URLSearchParams(qs || ''), seg = path.split('/');
    let p = pageOf(seg[0]), item = seg[1] || '';
    if (!p && /^(sk|rn|eq|cur)-\d+$/.test(seg[0])) { item = seg[0]; p = pageOfItem(item); }   // 舊連結 #sk-0042
    renderMenu(p);
    if (!p) { renderHome(); scrollTo(0, 0); return; }
    if (item && DETAIL_SRC.has(p.src)) { openDetail(p, item); scrollTo(0, 0); return; }
    openPage(p, params);
    if (item) { const el = document.getElementById(item); if (el) { el.scrollIntoView({ block: 'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600); } }
    else scrollTo(0, 0);
  }
  addEventListener('hashchange', route);

  /* ---------- 篩選事件 ---------- */
  $('subcats').addEventListener('click', e => { const a = e.target.closest('a[data-w]'); if (!a) return; e.preventDefault(); $('weapon').value = a.dataset.w; renderSub(); render(); });
  $('cats').addEventListener('click', e => { const a = e.target.closest('a[data-c]'); if (!a) return; e.preventDefault(); curCat = a.dataset.c; renderCats(); render(); });
  $('tags').addEventListener('click', e => { const b = e.target.closest('button[data-t]'); if (!b) return; const t = b.dataset.t; selTags.has(t) ? selTags.delete(t) : selTags.add(t); renderTags(); render(); });
  let qt; $('q').addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(render, 120); });
  $('sort').onchange = render; $('weapon').onchange = render;
  // 名稱旁的編號連結：改成 #/頁面/編號，複製後可直接開到該項目
  document.addEventListener('click', e => { const a = e.target.closest('a.it-id,a.sk-name,td.ic .icon'); if (!a) return;
    const id = a.matches('.icon') ? a.closest('tr')?.id : (a.getAttribute('href') || '').slice(1); const p = pageOfItem(id); if (!p) return;
    e.preventDefault();
    if (DETAIL_SRC.has(p.src)) { tip.hidden = true; location.hash = `#/${p.id}/${id}`; return; }   // 技能：進入詳細頁（瀏覽器「上一頁」可回列表）
 history.replaceState(null, '', `#/${p.id}/${id}`); const el = document.getElementById(id); if (el) { el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600); } });

  /* ---------- 提示框 ---------- */
  const tip = $('tip');
  function placeTip(e) { const w = tip.offsetWidth, h = tip.offsetHeight, m = 14; let x = e.clientX + m, y = e.clientY + m;
    if (x + w > innerWidth - 8) x = e.clientX - w - m; if (y + h > innerHeight - 8) y = Math.max(8, innerHeight - h - 8);
    tip.style.left = Math.max(8, x) + 'px'; tip.style.top = y + 'px'; }
  const findItem = id => { for (const p of PAGES) { const s = p.items.find(x => x.id === id); if (s) return [s, SRC[p.src]]; } return []; };
  document.addEventListener('mouseover', e => { const a = e.target.closest('[data-tip]'); if (!a) return; const [s, s0] = findItem(a.dataset.tip); if (!s) return;
    useSheet(s0); tip.className = s0.card ? 'itip' : 'itip sk'; tip.innerHTML = cardOf(s0).tip(s, s0.meta); tip.hidden = false; placeTip(e); });
  document.addEventListener('mousemove', e => { if (!tip.hidden) placeTip(e); });
  document.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]') && !e.relatedTarget?.closest?.('[data-tip]')) tip.hidden = true; });
  addEventListener('scroll', () => { tip.hidden = true; }, { passive: true });

  /* ---------- 版本切換：預設最新版；網址 ?v=資料夾 可指定版本 ---------- */
  const VL = window.LOOTANIA_VERSIONS;
  const VERS = VL && Array.isArray(VL.versions) && VL.versions.length ? VL : null;
  const latestV = VERS ? (VERS.versions.find(v => v.version === VERS.latest) || VERS.versions[0]) : null;
  let curV = null;
  const loadScript = src => new Promise(res => { const el = document.createElement('script'); el.src = src;
    el.onload = () => { el.remove(); res(true); }; el.onerror = () => { el.remove(); res(false); }; document.head.appendChild(el); });
  function renderVer() {
    $('verBox').hidden = !VERS; if (!VERS) return;
    $('ver').innerHTML = VERS.versions.map((v, i) => `<option value="${i}"${v === curV ? ' selected' : ''}>${esc(v.version)}${v === latestV ? '（最新）' : ''}</option>`).join('');
    const old = curV && curV !== latestV;
    $('verOld').hidden = !old;
    if (old) $('verOld').innerHTML = `目前顯示 <b>${esc(curV.version)}</b> 的資料，不是最新版。<button id="verLatest">切換到最新版（${esc(latestV.version)}）</button>`;
  }
  async function loadVersion(v) {
    curV = v; VDIR = DATA_DIR + (v.dir ? String(v.dir).replace(/\/?$/, '/') : '');
    const inl = window.WIKI_INLINE && window.WIKI_INLINE[v.dir];   // 預覽版：資料直接內嵌
    for (const [k, s] of Object.entries(SRC)) { window[s.var] = undefined; if (inl) window[s.var] = inl[k] || inl[s.list]; else await loadScript(VDIR + s.js); }
    initData(); for (const k of Object.keys(listHash)) delete listHash[k];
    renderVer(); route();
  }
  function setVersion(v) {
    try { const u = new URL(location.href); if (v === latestV) u.searchParams.delete('v'); else u.searchParams.set('v', v.dir); history.replaceState(null, '', u.href); } catch (e) {}
    loadVersion(v);
  }
  $('ver').addEventListener('change', e => setVersion(VERS.versions[+e.target.value]));
  $('verOld').addEventListener('click', e => { if (e.target.id === 'verLatest') setVersion(latestV); });
  (function boot() {
    if (!VERS) { loadVersion({ version: '', dir: '' }); return; }   // 沒有 versions.js：直接讀資料夾裡的 skills.js（舊結構）
    let want = null; try { want = new URLSearchParams(location.search).get('v'); } catch (e) {}
    loadVersion(VERS.versions.find(v => v.dir === want || v.version === want) || latestV);
  })();
})();
</script>
</body>
</html>
